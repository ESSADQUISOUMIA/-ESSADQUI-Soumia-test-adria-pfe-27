server:
  port: 8081
  address: 127.0.0.1

spring:
  application:
    name: account-service

  datasource:
    url: jdbc:h2:file:./data/accounts
    username: sa
    password: ${ACCOUNT_DB_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: false

  graphql:
    graphiql:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true